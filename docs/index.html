<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LZA Pipeline - Queue Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      padding: 24px;
      min-height: 100vh;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid #21262d;
    }
    .header h1 {
      font-size: 24px;
      color: #f0f6fc;
    }
    .header .refresh {
      color: #8b949e;
      font-size: 13px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      max-width: 1400px;
    }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 20px;
    }
    .card h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8b949e;
      margin-bottom: 16px;
    }
    .card.full-width { grid-column: 1 / -1; }
    .item {
      display: flex;
      align-items: center;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 8px;
      background: #0d1117;
      border: 1px solid #21262d;
    }
    .item:last-child { margin-bottom: 0; }
    .item .icon { font-size: 18px; margin-right: 12px; flex-shrink: 0; }
    .item .content { flex: 1; }
    .item .title { font-size: 14px; color: #f0f6fc; font-weight: 500; }
    .item .meta { font-size: 12px; color: #8b949e; margin-top: 2px; }
    .item .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
      flex-shrink: 0;
    }
    .badge-running { background: #1f6feb33; color: #58a6ff; border: 1px solid #1f6feb; }
    .badge-queued { background: #6e40c933; color: #bc8cff; border: 1px solid #6e40c9; }
    .badge-success { background: #23863633; color: #3fb950; border: 1px solid #238636; }
    .badge-failed { background: #da363333; color: #f85149; border: 1px solid #da3633; }
    .badge-waiting { background: #9e6a0333; color: #d29922; border: 1px solid #9e6a03; }
    .env-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .env-item {
      text-align: center;
      padding: 16px;
      border-radius: 6px;
      background: #0d1117;
      border: 1px solid #21262d;
    }
    .env-item .env-name { font-size: 12px; color: #8b949e; text-transform: uppercase; }
    .env-item .env-status { font-size: 24px; margin: 8px 0 4px; }
    .env-item .env-label { font-size: 12px; color: #c9d1d9; }
    .empty { color: #484f58; font-style: italic; padding: 12px; font-size: 13px; }
    .position { display: inline-block; width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 50%; background: #21262d; color: #8b949e; font-size: 11px; font-weight: bold; margin-right: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>LZA Config Pipeline</h1>
    <span class="refresh" id="lastUpdated">Loading...</span>
  </div>

  <div class="grid">
    <!-- Merge Queue -->
    <div class="card">
      <h2>Merge Queue</h2>
      <div id="queue-items">
        <div class="empty">Loading...</div>
      </div>
    </div>

    <!-- Currently Executing -->
    <div class="card">
      <h2>Currently Executing</h2>
      <div id="executing-items">
        <div class="empty">Loading...</div>
      </div>
    </div>

    <!-- Onboarding Status -->
    <div class="card">
      <h2>Onboarding Dispatch</h2>
      <div class="env-grid" id="onboard-status">
        <div class="env-item"><div class="env-name">dev</div><div class="env-status">⏳</div><div class="env-label">Loading</div></div>
        <div class="env-item"><div class="env-name">uat</div><div class="env-status">⏳</div><div class="env-label">Loading</div></div>
        <div class="env-item"><div class="env-name">prd</div><div class="env-status">⏳</div><div class="env-label">Loading</div></div>
      </div>
    </div>

    <!-- Recent PRs -->
    <div class="card">
      <h2>Pending PRs</h2>
      <div id="pending-prs">
        <div class="empty">Loading...</div>
      </div>
    </div>

    <!-- Deploy History -->
    <div class="card full-width">
      <h2>Recent Deploys</h2>
      <div id="deploy-history">
        <div class="empty">Loading...</div>
      </div>
    </div>
  </div>

  <script>
    const REPO = 'rmit-its/lza-pipeline-trial';
    const API = 'https://api.github.com';

    // Try to load token from URL param for demo, otherwise uses unauthenticated (60 req/hr)
    const params = new URLSearchParams(window.location.search);
    const TOKEN = params.get('token') || '';
    const headers = TOKEN ? { 'Authorization': `token ${TOKEN}` } : {};

    async function fetchJSON(url) {
      const res = await fetch(url, { headers });
      if (!res.ok) return null;
      return res.json();
    }

    function timeAgo(date) {
      const seconds = Math.floor((new Date() - new Date(date)) / 1000);
      if (seconds < 60) return `${seconds}s ago`;
      if (seconds < 3600) return `${Math.floor(seconds/60)}m ago`;
      if (seconds < 86400) return `${Math.floor(seconds/3600)}h ago`;
      return `${Math.floor(seconds/86400)}d ago`;
    }

    function badge(status) {
      const map = {
        'in_progress': ['running', 'Running'],
        'queued': ['queued', 'Queued'],
        'waiting': ['waiting', 'Waiting'],
        'completed_success': ['success', 'Passed'],
        'completed_failure': ['failed', 'Failed'],
        'success': ['success', 'Passed'],
        'failure': ['failed', 'Failed'],
        'idle': ['success', 'Idle'],
      };
      const [cls, label] = map[status] || ['queued', status];
      return `<span class="badge badge-${cls}">${label}</span>`;
    }

    async function loadQueue() {
      // Check for merge group runs (these are queue entries)
      const runs = await fetchJSON(`${API}/repos/${REPO}/actions/runs?event=merge_group&per_page=10`);
      const container = document.getElementById('queue-items');

      if (!runs || !runs.workflow_runs || runs.workflow_runs.length === 0) {
        container.innerHTML = '<div class="empty">Queue is empty — no PRs waiting</div>';
        return;
      }

      const active = runs.workflow_runs.filter(r => r.status !== 'completed');
      if (active.length === 0) {
        container.innerHTML = '<div class="empty">Queue is empty — no PRs waiting</div>';
        return;
      }

      container.innerHTML = active.map((r, i) => `
        <div class="item">
          <span class="position">${i + 1}</span>
          <div class="content">
            <div class="title">${r.display_title}</div>
            <div class="meta">${timeAgo(r.created_at)} · ${r.head_branch}</div>
          </div>
          ${badge(r.status)}
        </div>
      `).join('');
    }

    async function loadExecuting() {
      // All currently running workflows
      const runs = await fetchJSON(`${API}/repos/${REPO}/actions/runs?status=in_progress&per_page=10`);
      const container = document.getElementById('executing-items');

      if (!runs || !runs.workflow_runs || runs.workflow_runs.length === 0) {
        container.innerHTML = '<div class="empty">Nothing executing right now</div>';
        return;
      }

      container.innerHTML = runs.workflow_runs.map(r => `
        <div class="item">
          <div class="icon">${r.event === 'workflow_dispatch' ? '🚀' : r.event === 'push' ? '📦' : '🔄'}</div>
          <div class="content">
            <div class="title">${r.display_title}</div>
            <div class="meta">${r.name} · ${timeAgo(r.created_at)}</div>
          </div>
          ${badge('in_progress')}
        </div>
      `).join('');
    }

    async function loadOnboarding() {
      // Last dispatch run per environment
      const runs = await fetchJSON(`${API}/repos/${REPO}/actions/workflows/lza-onboard.yml/runs?per_page=15`);
      const container = document.getElementById('onboard-status');

      const envStatus = { dev: null, uat: null, prd: null };

      if (runs && runs.workflow_runs) {
        for (const run of runs.workflow_runs) {
          const env = run.display_title.match(/LZA Onboard - (dev|uat|prd)/)?.[1];
          if (env && !envStatus[env]) {
            envStatus[env] = run;
          }
        }
      }

      container.innerHTML = Object.entries(envStatus).map(([env, run]) => {
        if (!run) return `<div class="env-item"><div class="env-name">${env}</div><div class="env-status">➖</div><div class="env-label">No runs</div></div>`;
        const icon = run.conclusion === 'success' ? '✅' : run.conclusion === 'failure' ? '❌' : run.status === 'in_progress' ? '🔄' : '⏳';
        const label = run.conclusion || run.status;
        return `<div class="env-item"><div class="env-name">${env}</div><div class="env-status">${icon}</div><div class="env-label">${label} · ${timeAgo(run.created_at)}</div></div>`;
      }).join('');
    }

    async function loadPendingPRs() {
      const prs = await fetchJSON(`${API}/repos/${REPO}/pulls?state=open&per_page=10`);
      const container = document.getElementById('pending-prs');

      if (!prs || prs.length === 0) {
        container.innerHTML = '<div class="empty">No open PRs</div>';
        return;
      }

      container.innerHTML = prs.map(pr => {
        const hasApproval = pr.labels?.some(l => l.name === 'approved');
        return `
        <div class="item">
          <div class="icon">📝</div>
          <div class="content">
            <div class="title">#${pr.number} ${pr.title}</div>
            <div class="meta">by ${pr.user.login} · ${timeAgo(pr.created_at)}</div>
          </div>
          ${badge(hasApproval ? 'completed_success' : 'waiting')}
        </div>`;
      }).join('');
    }

    async function loadDeploys() {
      // Recent push-to-main deploy runs
      const runs = await fetchJSON(`${API}/repos/${REPO}/actions/workflows/lza-deploy.yml/runs?per_page=10`);
      const container = document.getElementById('deploy-history');

      if (!runs || !runs.workflow_runs || runs.workflow_runs.length === 0) {
        container.innerHTML = '<div class="empty">No deploys yet</div>';
        return;
      }

      container.innerHTML = runs.workflow_runs.slice(0, 8).map(r => {
        const icon = r.conclusion === 'success' ? '✅' : r.conclusion === 'failure' ? '❌' : '🔄';
        const status = r.conclusion === 'success' ? 'completed_success' : r.conclusion === 'failure' ? 'completed_failure' : 'in_progress';
        return `
        <div class="item">
          <div class="icon">${icon}</div>
          <div class="content">
            <div class="title">${r.display_title}</div>
            <div class="meta">${new Date(r.created_at).toLocaleString()} · ${r.run_number ? '#' + r.run_number : ''}</div>
          </div>
          ${badge(status)}
        </div>`;
      }).join('');
    }

    async function refresh() {
      await Promise.all([
        loadQueue(),
        loadExecuting(),
        loadOnboarding(),
        loadPendingPRs(),
        loadDeploys(),
      ]);
      document.getElementById('lastUpdated').textContent = `Last updated: ${new Date().toLocaleTimeString()} · Refreshes every 30s`;
    }

    refresh();
    setInterval(refresh, 30000);
  </script>
</body>
</html>
