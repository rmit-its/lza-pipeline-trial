name: Deploy Dashboard

on:
  workflow_run:
    workflows: ["CI - LZA Config Validation", "LZA Deploy", "LZA Onboard"]
    types: [completed]
  pull_request:
    types: [opened, closed, synchronize]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate dashboard data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch open PRs
          gh pr list --repo rmit-its/lza-pipeline-trial --state open --json number,title,author,createdAt,headRefName,labels \
            > docs/prs.json

          # Fetch recent deploy runs
          gh run list --repo rmit-its/lza-pipeline-trial --workflow "LZA Deploy" --limit 10 --json databaseId,displayTitle,conclusion,status,createdAt,number,url \
            > docs/deploys.json

          # Fetch onboarding runs
          gh run list --repo rmit-its/lza-pipeline-trial --workflow "LZA Onboard" --limit 15 --json databaseId,displayTitle,conclusion,status,createdAt,url \
            > docs/onboard.json

          # Fetch currently running workflows
          gh run list --repo rmit-its/lza-pipeline-trial --status in_progress --json databaseId,displayTitle,name,status,createdAt,event,url \
            > docs/executing.json

          # Fetch merge group runs (queue entries)
          gh run list --repo rmit-its/lza-pipeline-trial --event merge_group --limit 10 --json databaseId,displayTitle,conclusion,status,createdAt,headBranch,url \
            > docs/queue.json

          # Write timestamp
          echo "{\"updated\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > docs/meta.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
